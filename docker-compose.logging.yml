# Overlay for log aggregation (Loki + Promtail + Grafana).
# Usage: docker compose -f docker-compose.yml -f docker-compose.logging.yml up -d
# Combinable with the Caddy overlay:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml -f docker-compose.logging.yml up -d
#
# Requirements: none beyond Docker itself — no new firewall rules, no new public
# ports. Grafana is bound to 127.0.0.1 only; access it via SSH tunnel (see README).

services:
  loki:
    image: grafana/loki:3.6.11
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    environment:
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-14}
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6.11
    user: root  # needs to read /var/run/docker.sock; the image runs as root by
                # default anyway, pinned explicitly rather than relied on.
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.5
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
