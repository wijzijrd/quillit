basePath: /
definitions:
  handler.AdminProject:
    properties:
      createdAt:
        type: integer
      createdBy:
        type: string
      id:
        type: string
      memberCount:
        type: integer
      name:
        type: string
      roleLabels:
        items:
          type: string
        type: array
      type:
        type: string
    type: object
  handler.AuthForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  handler.AuthLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.AuthRegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handler.AuthResetPasswordRequest:
    properties:
      newPassword:
        type: string
      token:
        type: string
    type: object
  handler.AuthStatusResponse:
    properties:
      registered:
        type: boolean
    type: object
  handler.ChatMessage:
    properties:
      body:
        type: string
      cardBody:
        type: string
      cardTitle:
        type: string
      createdAt:
        type: integer
      entryId:
        type: string
      id:
        type: string
      projectId:
        type: string
      senderId:
        type: string
      sessionId:
        type: string
      type:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.GameSession:
    properties:
      id:
        type: string
      projectId:
        type: string
      startedAt:
        type: integer
      startedBy:
        type: string
      status:
        type: string
      stoppedAt:
        type: integer
      stoppedBy:
        type: string
    type: object
  handler.MeResponse:
    properties:
      active:
        type: boolean
      email:
        type: string
      role:
        type: string
      sub:
        type: string
    type: object
  handler.OkResponse:
    properties:
      ok:
        type: boolean
    type: object
  handler.Project:
    properties:
      createdAt:
        type: integer
      createdBy:
        type: string
      id:
        type: string
      live:
        type: boolean
      memberCount:
        type: integer
      members:
        items:
          $ref: '#/definitions/handler.ProjectMember'
        type: array
      myRole:
        type: string
      name:
        type: string
      roleLabels:
        description: '[editorLabel, memberLabel]'
        items:
          type: string
        type: array
      type:
        type: string
    type: object
  handler.ProjectInvite:
    properties:
      createdBy:
        type: string
      expiresAt:
        type: integer
      id:
        type: string
      projectId:
        type: string
      role:
        type: string
      token:
        type: string
    type: object
  handler.ProjectMember:
    properties:
      id:
        type: string
      joinedAt:
        type: integer
      projectId:
        type: string
      role:
        type: string
      userId:
        type: string
      username:
        type: string
    type: object
  handler.ProjectType:
    properties:
      label:
        type: string
      roleLabels:
        items:
          type: string
        type: array
      type:
        type: string
    type: object
  handler.UsernameAvailableResponse:
    properties:
      available:
        type: boolean
    type: object
host: localhost:3000
info:
  contact: {}
  description: 'Backend-for-frontend: session management, projects, game mode, content
    proxy.'
  title: Quillit BFF API
  version: "1.0"
paths:
  /api/admin/projects:
    get:
      description: Returns all projects with member counts. Supports ?q= name search.
      parameters:
      - description: Search by project name
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.AdminProject'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List all projects (admin)
      tags:
      - admin
  /api/admin/projects/{id}/members:
    get:
      description: Returns all members for the given project, regardless of admin's
        own membership.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ProjectMember'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List members of any project (admin)
      tags:
      - admin
  /api/admin/users:
    get:
      description: Proxies to auth-svc. Supports ?q= search and ?active= filter.
      parameters:
      - description: Search by email or username
        in: query
        name: q
        type: string
      - description: 'Filter: true or false'
        in: query
        name: active
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List users (admin)
      tags:
      - admin
  /api/admin/users/{id}:
    delete:
      description: Proxies to auth-svc. Permanently removes the user account.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Delete user (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: 'Proxies to auth-svc. Supports { active: bool } to enable/disable
        an account.'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: '{ active: bool }'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update user (admin)
      tags:
      - admin
  /api/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Proxies to auth-svc. Always returns 200 regardless of whether the
        email is registered.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AuthForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OkResponse'
      summary: Forgot password
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Forwards credentials to auth-svc, creates an HTTP-only session
        cookie on success.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Deletes the session and clears the session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OkResponse'
      summary: Logout
      tags:
      - auth
  /api/auth/me:
    get:
      description: Returns identity decoded from the session JWT cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Current user
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Forwards credentials to auth-svc, creates an HTTP-only session
        cookie on success.
      parameters:
      - description: Registration credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AuthRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register
      tags:
      - auth
  /api/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Proxies to auth-svc.
      parameters:
      - description: Token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AuthResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /api/auth/status:
    get:
      description: Proxies to auth-svc to check whether any users are registered.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthStatusResponse'
      summary: Auth status
      tags:
      - auth
  /api/auth/users/available:
    get:
      description: Proxies to auth-svc to check whether a username is free to register.
      parameters:
      - description: Username to check
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UsernameAvailableResponse'
      summary: Username availability
      tags:
      - auth
  /api/content/entries/{id}:
    delete:
      parameters:
      - description: Entry ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete an entry (proxied to content-svc)
      tags:
      - content
    get:
      parameters:
      - description: Entry ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get an entry, including its resolved body (proxied to content-svc)
      tags:
      - content
    patch:
      consumes:
      - application/json
      parameters:
      - description: Entry ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update an entry (proxied to content-svc)
      tags:
      - content
  /api/content/entries/{id}/images/{filename}:
    get:
      parameters:
      - description: Entry ID
        in: path
        name: id
        required: true
        type: string
      - description: Image filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - image/*
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get an entry image (proxied to content-svc)
      tags:
      - content
  /api/content/entries/{id}/render:
    get:
      description: view and card are mutually exclusive; query params pass through
        verbatim.
      parameters:
      - description: Entry ID
        in: path
        name: id
        required: true
        type: string
      - description: dm (default) or player
        in: query
        name: view
        type: string
      - description: facet name
        in: query
        name: card
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Render an entry to an HTML fragment (proxied to content-svc)
      tags:
      - content
  /api/content/facets:
    get:
      description: Proxies to the content service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: List global facets
      tags:
      - facets
    post:
      consumes:
      - application/json
      description: 'Proxies to the content service. Body: { name: string } (kebab-case).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Add a global facet
      tags:
      - facets
  /api/content/facets/{name}:
    delete:
      description: Proxies to the content service. Entry bodies are untouched — the
        response carries a reminder.
      parameters:
      - description: Facet name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Remove a global facet
      tags:
      - facets
  /api/content/projects/{id}/entries:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List a project's entries (proxied to content-svc)
      tags:
      - content
    post:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Create an entry in a project (proxied to content-svc)
      tags:
      - content
  /api/content/projects/{id}/facets:
    get:
      description: Proxies to the content service. Union of global facets and this
        project's own.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: List a project's effective facet vocabulary
      tags:
      - facets
    post:
      consumes:
      - application/json
      description: 'Proxies to the content service. Body: { name: string } (kebab-case).'
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Add a project-specific facet
      tags:
      - facets
  /api/content/projects/{id}/facets/{name}:
    delete:
      description: Proxies to the content service. Only removes from this project's
        own facets; entry bodies are untouched — the response carries a reminder.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Facet name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Remove a project-specific facet
      tags:
      - facets
  /api/content/projects/{id}/import:
    post:
      consumes:
      - application/gzip
      description: Requires session and membership in the target project. Body is
        a tar.gz; query params pass through (mode, onConflict, createFacets).
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Import a CLI project tarball (proxied to content-svc)
      tags:
      - content
  /api/me/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get the caller's settings
      tags:
      - settings
    patch:
      consumes:
      - application/json
      description: 'Shallow merge: each top-level key in the body overwrites the stored
        key; a null value deletes the key.'
      parameters:
      - description: Settings patch (JSON object)
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Merge settings into the caller's stored settings
      tags:
      - settings
  /api/projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.Project'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List projects for the current user
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project name and type
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.Project'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Create a project
      tags:
      - projects
  /api/projects/{id}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Delete a project
      tags:
      - projects
    patch:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Project'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update a project
      tags:
      - projects
  /api/projects/{id}/invite:
    post:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: role override (defaults to member role)
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.ProjectInvite'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Generate an invite link for a project
      tags:
      - projects
  /api/projects/{id}/invite/{token}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Invite token
        in: path
        name: token
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Revoke an invite token
      tags:
      - projects
  /api/projects/{id}/members:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ProjectMember'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List project members
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: userId and role
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.ProjectMember'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Add a member to a project
      tags:
      - projects
  /api/projects/{id}/members/{userId}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID to remove
        in: path
        name: userId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Remove a member from a project
      tags:
      - projects
  /api/projects/{projectId}/session/{sessionId}/messages:
    get:
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ChatMessage'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
