basePath: /
definitions:
  handler.ClaimsResponse:
    properties:
      active:
        type: boolean
      email:
        type: string
      exp:
        type: number
      role:
        type: string
      sub:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handler.StatusResponse:
    properties:
      registered:
        type: boolean
    type: object
  handler.TokenResponse:
    properties:
      token:
        type: string
    type: object
  handler.UserResponse:
    properties:
      active:
        type: boolean
      createdAt:
        type: integer
      email:
        type: string
      id:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  handler.UserSearchResult:
    properties:
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  handler.UsernameAvailableResponse:
    properties:
      available:
        type: boolean
    type: object
  handler.VerifyRequest:
    properties:
      token:
        type: string
    type: object
host: localhost:3002
info:
  contact: {}
  description: 'Authentication service: register, login, token verification.'
  title: Quillit Auth Service API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with email and password and returns a signed JWT.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user account. Returns 409 if email or username is taken.
      parameters:
      - description: Registration credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/status:
    get:
      description: Returns whether any users are registered in the auth database.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatusResponse'
      summary: Registration status
      tags:
      - auth
  /auth/users:
    get:
      description: Returns all users, optionally filtered. Requires admin JWT.
      parameters:
      - description: Search by email or username
        in: query
        name: q
        type: string
      - description: 'Filter by active status: true or false'
        in: query
        name: active
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.UserResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List users
      tags:
      - admin
  /auth/users/{id}:
    delete:
      description: Permanently removes a user account. Requires admin JWT.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Delete a user
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: 'Updates user fields (currently: active). Requires admin JWT.'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update a user
      tags:
      - admin
  /auth/users/available:
    get:
      description: Returns whether a username is not yet taken.
      parameters:
      - description: Username to check
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UsernameAvailableResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Username availability
      tags:
      - auth
  /auth/users/search:
    get:
      description: Returns users matching the query (email or username). Any valid
        JWT required.
      parameters:
      - description: Search term
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.UserSearchResult'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Search users
      tags:
      - auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Validates a JWT and returns its decoded claims. Used internally
        by quillit-svc.
      parameters:
      - description: Token to verify
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ClaimsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Verify a JWT
      tags:
      - auth
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
swagger: "2.0"
