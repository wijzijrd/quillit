server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Uncomment to restrict discovery to this Compose project only, if this
        # host ever runs unrelated containers (verify the actual project name
        # with `docker compose ls` first — it defaults to the checkout dir name).
        # filters:
        #   - name: label
        #     values: ["com.docker.compose.project=quillit"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
      - source_labels: ["__meta_docker_container_id"]
        target_label: "container_id"
