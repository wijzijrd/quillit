basePath: /
definitions:
  handler.ClaimsResponse:
    properties:
      email:
        type: string
      exp:
        type: number
      role:
        type: string
      sub:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handler.StatusResponse:
    properties:
      registered:
        type: boolean
    type: object
  handler.TokenResponse:
    properties:
      token:
        type: string
    type: object
  handler.VerifyRequest:
    properties:
      token:
        type: string
    type: object
host: localhost:3002
info:
  contact: {}
  description: 'Authentication service: register, login, token verification.'
  title: Quillit Auth Service API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with email and password and returns a signed JWT.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a GM account. Returns 409 if email or username is taken.
      parameters:
      - description: Registration credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/status:
    get:
      description: Returns whether any users are registered in the auth database.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatusResponse'
      summary: Registration status
      tags:
      - auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Validates a JWT and returns its decoded claims. Used internally
        by quillit-svc.
      parameters:
      - description: Token to verify
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ClaimsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Verify a JWT
      tags:
      - auth
swagger: "2.0"
