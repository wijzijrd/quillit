# Overlay for HTTPS via Caddy.
# Usage: docker compose -f infra/docker-compose.yml -f infra/docker-compose.caddy.yml --project-directory . up -d
#
# Requirements:
#   - Docker Compose v2.24+ (ships with Docker Engine 25+)
#   - A domain with an A record pointing at this machine's public IP
#   - Ports 80 and 443 open in your firewall
#   - CORS_ORIGIN=https://your.domain.com and COOKIE_SECURE=true in .env
#
# For LAN-only self-signed HTTPS (no domain, no ACME) instead, see
# Caddyfile.internal.example and the README section "HTTPS on your local
# network (self-signed, no domain)" — same overlay, same Caddyfile, just set
# CADDY_HOST in .env.

services:
  ui:
    ports: !reset []

  caddy:
    image: caddy:alpine
    environment:
      - CADDY_HOST=${CADDY_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ui
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
