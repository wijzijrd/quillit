name: quillit

services:
  auth:
    build:
      context: ..
      dockerfile: app/auth/Dockerfile
    image: quillit-auth
    volumes:
      - auth-data:/data
    environment:
      PORT: 3002
      DB_PATH: /data/quillit-auth.db
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      MESSAGING_SERVICE_URL: http://messaging:3003
      APP_BASE_URL: ${APP_BASE_URL}
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET}
    depends_on:
      - messaging
    restart: unless-stopped

  messaging:
    build:
      context: ..
      dockerfile: app/messaging/Dockerfile
    image: quillit-messaging
    environment:
      PORT: 3003
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET}
    restart: unless-stopped

  svc:
    build:
      context: ..
      dockerfile: app/svc/Dockerfile
    image: quillit-svc
    volumes:
      - svc-data:/data
    environment:
      PORT: 3000
      DB_PATH: /data/quillit.db
      AUTH_SERVICE_URL: http://auth:3002
      CONTENT_SERVICE_URL: http://content:3004
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET: quillit
      MINIO_USE_SSL: "false"
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET}
    depends_on:
      - auth
      - minio
      - messaging
    restart: unless-stopped

  content:
    build:
      context: ..
      dockerfile: app/content/Dockerfile
    image: quillit-content
    volumes:
      - content-data:/data
    environment:
      PORT: 3004
      DB_PATH: /data/quillit-content.db
      JWT_SECRET: ${JWT_SECRET}
      SVC_SERVICE_URL: http://svc:3000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET: quillit
      MINIO_USE_SSL: "false"
      INTERNAL_RPC_SECRET: ${INTERNAL_RPC_SECRET}
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  ui:
    build:
      context: ../app/ui
    image: quillit-ui
    ports:
      - "8080:80"
    depends_on:
      - svc
    restart: unless-stopped

volumes:
  auth-data:
  content-data:
  svc-data:
  minio-data:
