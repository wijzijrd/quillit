services:
  quillit-auth-svc:
    build:
      context: ../quillit-auth-svc
    image: quillit-auth-svc
    ports:
      - "3002:3002"
    volumes:
      - auth-data:/data
    environment:
      PORT: 3002
      DB_PATH: /data/quillit-auth.db
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    restart: unless-stopped

  quillit-svc:
    build:
      context: .
    image: quillit-svc
    ports:
      - "3000:3000"
    volumes:
      - svc-data:/data
    environment:
      PORT: 3000
      DB_PATH: /data/quillit.db
      AUTH_SERVICE_URL: http://quillit-auth-svc:3002
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - quillit-auth-svc
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  quillit-ui:
    build:
      context: ../quillit-ui
    image: quillit-ui
    ports:
      - "8080:80"
    depends_on:
      - quillit-svc
    restart: unless-stopped

volumes:
  auth-data:
  svc-data:
  minio-data:
