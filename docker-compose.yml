services:
  auth:
    build:
      context: ./auth
    image: quillit-auth
    volumes:
      - auth-data:/data
    environment:
      PORT: 3002
      DB_PATH: /data/quillit-auth.db
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    restart: unless-stopped

  svc:
    build:
      context: ./svc
    image: quillit-svc
    volumes:
      - svc-data:/data
    environment:
      PORT: 3000
      DB_PATH: /data/quillit.db
      AUTH_SERVICE_URL: http://auth:3002
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET: quillit
      MINIO_USE_SSL: "false"
    depends_on:
      - auth
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    image: quillit-ui
    ports:
      - "8080:80"
    depends_on:
      - svc
    restart: unless-stopped

volumes:
  auth-data:
  svc-data:
  minio-data:
