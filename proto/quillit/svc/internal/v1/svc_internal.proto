syntax = "proto3";

// SvcInternalService is svc's server-to-server surface, reached only by
// other trusted services on the compose network (currently: content,
// checking authorization for its own endpoints). It is the connectrpc
// replacement for svc's existing internal-only HTTP route
// GET /internal/projects/{id}/members/{userId}
// (app/svc/internal/handler/projects.go's InternalMembership), called
// today by app/content/internal/authz.SvcChecker.checkSvc.
package quillit.svc.internal.v1;

option go_package = "github.com/quillit/gen/quillit/svc/internal/v1;svcv1";

// SvcInternalService is served by svc and called by content.
service SvcInternalService {
  rpc CheckMembership(CheckMembershipRequest) returns (CheckMembershipResponse);
}

message CheckMembershipRequest {
  string project_id = 1;
  string user_id = 2;
}

// CheckMembershipResponse mirrors svc's membershipResponse
// (app/svc/internal/handler/projects.go), minus the project_id/user_id
// echo (the caller already has both) plus is_member, which the HTTP route
// today expresses as 200-vs-404 rather than a body field — checkSvc treats
// a 200 as member=true and a 404 as member=false (both definitive,
// cacheable answers; see authz.go's checkSvc doc comment), so is_member
// makes that distinction explicit instead of encoding it in RPC status.
message CheckMembershipResponse {
  bool is_member = 1;
  string role = 2;
  string project_type = 3;
}
