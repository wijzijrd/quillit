name: App service pipeline

# Reusable workflow for one app service (auth, svc, messaging, or ui).
# Called once per service by ci.yml, each with its own `service`/`port`
# input — every call gets its own independent job graph, so a failing
# `messaging` test blocks only the `messaging` deploy, never the other
# three services.

on:
  workflow_call:
    inputs:
      service:
        description: "Directory name under app/ (auth, svc, messaging, ui)"
        required: true
        type: string
      port:
        description: "Port the service's /healthz listens on (ui is checked at / on 80 instead)"
        required: true
        type: number

jobs:
  test:
    name: Test ${{ inputs.service }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        if: inputs.service != 'ui'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # GOWORK=off: the repo-root go.work workspace (cli/ + pkg/contentengine/)
      # gets auto-detected by directory-walk from anywhere in this repo, but
      # the app services aren't workspace members — left on, `go test ./...`
      # here fails with "directory prefix . does not contain modules listed
      # in go.work".
      - name: Test (go test ./...)
        if: inputs.service != 'ui'
        working-directory: app/${{ inputs.service }}
        env:
          GOWORK: "off"
        run: go test ./...

      - name: Set up Node
        if: inputs.service == 'ui'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        if: inputs.service == 'ui'
        working-directory: app/ui
        run: npm ci

      - name: Type check (vue-tsc)
        if: inputs.service == 'ui'
        working-directory: app/ui
        run: npx vue-tsc --noEmit

      - name: Build
        if: inputs.service == 'ui'
        working-directory: app/ui
        run: npm run build

  deploy:
    name: Deploy ${{ inputs.service }}
    needs: test
    if: always() && needs.test.result != 'failure'
    runs-on: [self-hosted, quillit]
    # Every job on the self-hosted runner requires manual approval — see
    # the home-server environment's required reviewers.
    environment: home-server
    timeout-minutes: 15
    steps:
      # Ephemeral per-run checkout instead of a persistent $HOME/quillit clone.
      # Lives under $GITHUB_WORKSPACE, not $RUNNER_TEMP: actions/checkout
      # rejects any `path:` that doesn't resolve under the workspace dir
      # (confirmed the hard way — https://github.com/wijzijrd/quillit/actions/runs/31317960482).
      # Still fully ephemeral in effect — fresh checkout every run, removed
      # by the cleanup step below regardless of success/failure.
      # -p quillit is pinned explicitly everywhere below: Compose otherwise
      # derives the project name from the checkout directory's basename, and
      # a mktemp path's basename isn't "quillit" — an unpinned project name
      # here would silently create a *new* Compose project on first run,
      # orphaning every existing named volume (auth-data, svc-data, ...).
      - name: Create ephemeral checkout dir
        run: |
          set -euo pipefail
          DIR=$(mktemp -d "${GITHUB_WORKSPACE}/quillit-${{ inputs.service }}-XXXXXX")
          echo "CHECKOUT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "COMPOSE=docker compose -f infra/docker-compose.yml ${{ vars.QUILLIT_COMPOSE_OVERLAYS }} -p quillit --env-file ${{ vars.QUILLIT_ENV_FILE }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ${{ env.CHECKOUT_DIR }}

      - name: Record previous image
        run: |
          set -euo pipefail
          echo "PREV_IMAGE_ID=$(docker image inspect --format '{{.Id}}' quillit-${{ inputs.service }} 2>/dev/null || true)" >> "$GITHUB_ENV"

      - name: Build & restart (no dependents touched)
        run: |
          set -euo pipefail
          cd "$CHECKOUT_DIR"
          $COMPOSE build ${{ inputs.service }}
          $COMPOSE up -d --no-deps ${{ inputs.service }}

      - name: Smoke test
        run: |
          set -euo pipefail
          cd "$CHECKOUT_DIR"
          if [ "${{ inputs.service }}" = "ui" ]; then
            $COMPOSE exec -T ui wget -q -O /dev/null http://localhost:80/
          else
            $COMPOSE exec -T ${{ inputs.service }} wget -q -O - http://localhost:${{ inputs.port }}/healthz
            echo
          fi

      - name: Roll back on failure
        if: failure()
        run: |
          set -euo pipefail
          cd "$CHECKOUT_DIR"
          if [ -z "${PREV_IMAGE_ID:-}" ]; then
            echo "::error::No previous ${{ inputs.service }} image recorded — cannot roll back."
            exit 1
          fi
          echo "::warning::${{ inputs.service }} deploy or smoke test failed — rolling back"
          docker tag "$PREV_IMAGE_ID" quillit-${{ inputs.service }}
          $COMPOSE up -d --no-deps ${{ inputs.service }}
          echo "${{ inputs.service }} rolled back to $PREV_IMAGE_ID."

      - name: Clean up ephemeral checkout
        if: always()
        run: rm -rf "${{ env.CHECKOUT_DIR }}"
