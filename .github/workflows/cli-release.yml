name: CLI Release

# Builds and publishes cross-platform `quillit` CLI binaries as a GitHub
# Release. Two ways to trigger:
#
#   - Push a tag matching cli-v*.*.* (e.g. cli-v0.1.0). The "cli-" prefix
#     namespaces this from any future per-component release tags
#     (content-v*, svc-v*, ...) — see #70's granular-deploy split.
#   - workflow_dispatch, for a manual/out-of-band run.
#
# The version embedded in the binaries (and the release's own tag) is
# NOT the pushed tag's literal name — it's derived from cli/version.txt
# plus the current commit's short sha, e.g. version.txt containing
# "v0.0.1" at commit e6e063e produces version "v0.0.1-e6e063e" and
# release tag "cli-v0.0.1-e6e063e". This ties every release to the exact
# source commit it was built from: bump cli/version.txt when you want to
# mark a new version line, and every build off that commit (or any
# commit before the next bump) carries a distinct, traceable identifier.
#
# Either way, tests run first (cli/ + pkg/contentengine/, since cli
# depends on it) — nothing untested gets released. A plain push or PR
# that happens to touch this file, or anything else in the repo, never
# triggers this workflow at all: the only push trigger is a tag ref
# matching cli-v*.*.*, which ordinary commits never create.

on:
  push:
    tags:
      - "cli-v*.*.*"
  workflow_dispatch: {}

jobs:
  prepare:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # Both cli/version.txt's content and the commit sha are repo-
      # controlled values (a file change requires a real commit, the sha
      # is git-computed) — no free-text user input flows into this
      # workflow anymore, unlike the tag-name-parsing / workflow_dispatch
      # `version` input this replaced.
      - name: Determine version and release tag from cli/version.txt + commit sha
        id: version
        run: |
          set -euo pipefail
          RAW_VERSION="$(tr -d '[:space:]' < cli/version.txt)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          VERSION="${RAW_VERSION}-${SHORT_SHA}"
          TAG="cli-${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Test cli + pkg/contentengine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Test pkg/contentengine
        working-directory: pkg/contentengine
        run: go test ./...
      - name: Test cli
        working-directory: cli
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # cli/go.mod's `replace github.com/quillit/contentengine =>
      # ../pkg/contentengine` resolves the shared content-engine package
      # from this same checkout — no go.work / workspace mode needed in
      # CI, a plain `go build` here follows the replace directive fine.
      - name: Build static binary
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUT="quillit"
          [ "$GOOS" = "windows" ] && OUT="quillit.exe"
          go build -trimpath \
            -ldflags "-s -w -X github.com/quillit/cli/cmd.Version=$VERSION" \
            -o "$OUT" .

      - name: Package
        working-directory: cli
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          NAME="quillit-${VERSION}-${GOOS}-${GOARCH}"
          mkdir "$NAME"
          if [ "$GOOS" = "windows" ]; then
            mv quillit.exe "$NAME"/
            zip -r "${NAME}.zip" "$NAME"
            sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          else
            mv quillit "$NAME"/
            tar -czf "${NAME}.tar.gz" "$NAME"
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: quillit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            cli/quillit-*.tar.gz
            cli/quillit-*.tar.gz.sha256
            cli/quillit-*.zip
            cli/quillit-*.zip.sha256
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums file
        working-directory: dist
        run: cat *.sha256 > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: quillit CLI ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
