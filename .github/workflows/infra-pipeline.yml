name: Infra pipeline

# Reusable workflow for infra/ changes outside the per-service compose file
# (the Caddy overlay + Caddyfile). infra/docker-compose.yml itself is
# covered by each app service's own filter in ci.yml, since a base-compose
# change can affect any service's container.

on:
  workflow_call: {}

jobs:
  validate:
    name: Validate compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config (base + caddy overlay)
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.caddy.yml config >/dev/null

  deploy:
    name: Restart caddy
    needs: validate
    if: always() && needs.validate.result == 'success'
    runs-on: [self-hosted, quillit]
    timeout-minutes: 10
    steps:
      # Ephemeral per-run checkout, -p quillit pinned — see app-pipeline.yml's
      # "Create ephemeral checkout dir" step for why the project name must be
      # pinned explicitly rather than left to Compose's directory-basename default.
      - name: Create ephemeral checkout dir
        run: |
          set -euo pipefail
          DIR=$(mktemp -d "${GITHUB_WORKSPACE}/quillit-infra-XXXXXX")
          echo "CHECKOUT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "COMPOSE=docker compose -f infra/docker-compose.yml ${{ vars.QUILLIT_COMPOSE_OVERLAYS }} -p quillit --env-file ${{ vars.QUILLIT_ENV_FILE }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ${{ env.CHECKOUT_DIR }}

      # No image to roll back to — Caddy is a pulled image (caddy:alpine),
      # not built from this repo, and the only thing that changes here is
      # the mounted Caddyfile + compose overlay. This fails loudly (rather
      # than no-op) if the caddy overlay isn't part of QUILLIT_COMPOSE_OVERLAYS
      # on a given server, since `caddy` wouldn't resolve as a known service.
      - name: Restart caddy
        run: cd "$CHECKOUT_DIR" && $COMPOSE up -d --no-deps caddy

      - name: Clean up ephemeral checkout
        if: always()
        run: rm -rf "${{ env.CHECKOUT_DIR }}"
