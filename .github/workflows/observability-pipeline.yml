name: Observability pipeline

# Reusable workflow for observability/ changes (Loki/Promtail/Grafana
# config) and the logging compose overlay.

on:
  workflow_call: {}

jobs:
  validate:
    name: Validate compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config (base + logging overlay)
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.logging.yml --project-directory . config >/dev/null

  deploy:
    name: Restart loki/promtail/grafana
    needs: validate
    if: always() && needs.validate.result == 'success'
    runs-on: [self-hosted, quillit]
    timeout-minutes: 10
    steps:
      # Ephemeral per-run checkout, -p quillit pinned — see app-pipeline.yml's
      # "Create ephemeral checkout dir" step for why the project name must be
      # pinned explicitly rather than left to Compose's directory-basename default.
      - name: Create ephemeral checkout dir
        run: |
          set -euo pipefail
          DIR=$(mktemp -d "${GITHUB_WORKSPACE}/quillit-observability-XXXXXX")
          echo "CHECKOUT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "COMPOSE=docker compose -f infra/docker-compose.yml ${{ vars.QUILLIT_COMPOSE_OVERLAYS }} -p quillit --project-directory . --env-file ${{ vars.QUILLIT_ENV_FILE }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ${{ env.CHECKOUT_DIR }}

      # All three are pulled images (grafana/loki, grafana/promtail,
      # grafana/grafana) — nothing built from this repo, so no image
      # rollback here. This fails loudly (rather than no-op) if the logging
      # overlay isn't part of QUILLIT_COMPOSE_OVERLAYS on a given server,
      # since these services wouldn't resolve as known services.
      - name: Restart loki, promtail, grafana
        run: cd "$CHECKOUT_DIR" && $COMPOSE up -d --no-deps loki promtail grafana

      - name: Clean up ephemeral checkout
        if: always()
        run: rm -rf "${{ env.CHECKOUT_DIR }}"
